<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectio - Introducción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: white;
            transform: scale(1.05);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 10;
        }
    </style>
    <link rel="stylesheet" href="/estilos/lectio-ui.css">
    <script src="/js/lectio-ui.js" defer></script>
    <link rel="stylesheet" href="/estilos/lectio-responsive.css">
<link rel="stylesheet" href="/estilos/lectio-experience.css">
<link rel="stylesheet" href="/estilos/lectio-motion.css">
<script src="/js/lectio-experience.js" defer></script>
<link rel="stylesheet" href="/estilos/lectio-polish.css">
<link rel="icon" type="image/svg+xml" href="/img/lectio-logo.svg">
<link rel="stylesheet" href="/estilos/lectio-library.css">
<script src="/js/lectio-intro.js" defer></script>
<link rel="stylesheet" href="/estilos/lectio-menu.css">
<script src="/js/lectio-menu.js" defer></script>
<link rel="stylesheet" href="/estilos/lectio-privacy.css">
<script src="/js/lectio-privacy.js" defer></script></head>
<body class="lectio-page" data-page="intro">

<div class="loading" id="loading">Cargando...</div>

<div class="video-container">
    <video id="intro-video" muted playsinline preload="none">
        <!-- Se selecciona automáticamente el video correcto -->
    </video>
</div>

<section class="mobile-expedition" aria-labelledby="expedition-title">
 <a href="/api/index" class="expedition-brand"><img src="/img/lectio-logo.svg" width="44" height="44" alt=""> LECTIO</a>
 <div class="expedition-cloud cloud-one" aria-hidden="true"></div><div class="expedition-cloud cloud-two" aria-hidden="true"></div>
 <div class="expedition-scene" aria-hidden="true"><div class="expedition-hill"></div><img src="/img/lio-explorador.svg" class="expedition-owl" alt=""><span class="found-book">Una historia encontrada</span></div>
 <div class="expedition-copy"><span class="expedition-kicker">Una aventura con Lio</span><h1 id="expedition-title">Las historias perdidas<br>nos están esperando.</h1><p>Un mapa, un par de alas y mil mundos por descubrir. ¿Vienes?</p><div class="expedition-timeline" aria-hidden="true"><span></span></div></div>
</section>
<a class="skip-btn" id="skip-btn" href="/api/index">Ir a la biblioteca</a>



</body>
</html>
